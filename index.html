<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>不老村守衛戰｜遊戲輔助系統</title>
<link rel="stylesheet" href="./style.css?v=20261011-7">
<style>
.scan-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}.scan-modal.hidden{display:none}.scan-box{width:min(560px,100%);background:#fff;border-radius:18px;padding:16px}.scan-box h2{margin:0 0 8px}.scan-video-wrap{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:68vh}.scan-video-wrap video{width:100%;height:100%;object-fit:cover;display:block}.scan-frame{position:absolute;left:10%;right:10%;top:38%;bottom:38%;border:4px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.22);pointer-events:none}.scan-frame::after{content:'只放卡號，例如 M002';position:absolute;left:0;right:0;bottom:-34px;text-align:center;color:#fff;font-size:14px;font-weight:700}.scan-status{margin:12px 0;font-weight:700;min-height:24px}.scan-actions{display:flex;gap:8px;flex-wrap:wrap}.scan-actions button{flex:1}.setup-scan{margin-top:16px;padding:14px;border:2px dashed #c9b98f;border-radius:12px;background:#fffdf8}.admin-link{display:inline-block;text-decoration:none;background:#666;color:#fff;font-weight:800;padding:11px 15px;border-radius:10px}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🏡 不老村守衛戰</h1>
  <div class="sub">純卡牌版｜卡牌資料庫與遊戲輔助系統</div>
  <div class="controls"><a class="admin-link" href="./admin.html">🗂️ 卡牌管理後台</a></div>
</header>

<section class="panel" id="setup">
  <h2>🎮 開局設定</h2>
  <div class="grid">
    <div><label>玩家人數</label><select id="players"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
    <div><label>本局冒險卡數量（自訂）</label><input id="adventureTotal" type="number" min="1" max="99" value="12"></div>
    <div><label>是否加入假面好人</label><select id="traitor"><option value="yes" selected>是</option><option value="no">否</option></select></div>
    <div><label>初始生命</label><input value="20" disabled></div>
  </div>

  <div class="setup-scan">
    <b>📷 開局前辨識卡牌文字</b>
    <p class="note">只需要讓卡號（例如 M002、K001）填滿辨識框，不要把整張卡塞進框內。</p>
    <div class="controls"><button onclick="startScanner('setup')">📷 開啟文字掃描</button></div>
    <div id="setupScanStatus" class="note">尚未辨識卡牌</div>
  </div>

  <div class="controls"><button onclick="startGame()">開始冒險</button></div>
</section>

<section class="panel hidden" id="game">
  <h2>📊 遊戲中控</h2>
  <div class="stats">
    <div class="stat">❤️ 生命<div class="big"><span id="hpText">20</span>/20</div></div>
    <div class="stat">🃏 冒險進度<div class="big"><span id="advNowText">0</span>/<span id="advTotalText">12</span></div></div>
    <div class="stat">🔎 卡牌辨識<div class="big">OCR</div></div>
  </div>
  <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
  <div class="controls"><button onclick="changeHp(2)">+2 HP</button><button onclick="changeHp(-2)">-2 HP</button><button onclick="changeHp(4)">+4 HP</button><button onclick="changeHp(-4)">-4 HP</button></div>
  <div style="margin-top:14px"><b>冒險進度</b><div class="progressbar"><div class="progressfill" id="progressfill"></div></div></div>

  <h2 style="margin-top:22px">📷 辨識／輸入卡號</h2>
  <p class="note">卡號建議使用黑字、白底、粗體，並至少佔辨識框寬度的一半以上。</p>
  <div class="grid">
    <input id="cardCode" placeholder="輸入 K001、M001、F001、E001、B001">
    <button onclick="identifyCard()">讀取卡牌</button>
  </div>
  <div class="controls"><button onclick="startScanner('game')">📷 辨識卡號文字</button></div>
  <div class="result" id="result"><h2>等待卡牌</h2><p>用相機辨識卡號文字，或手動輸入卡號。</p></div>
</section>
</div>

<div id="scannerModal" class="scan-modal hidden">
  <div class="scan-box">
    <h2>📷 辨識卡號文字</h2>
    <p class="note">把「卡號本身」放大填滿白框。程式只讀 K/M/F/E/B/R/L + 數字。</p>
    <div class="scan-video-wrap">
      <video id="scannerVideo" playsinline muted></video>
      <div class="scan-frame"></div>
    </div>
    <div id="scannerStatus" class="scan-status">準備開啟相機…</div>
    <div class="scan-actions">
      <button onclick="recognizeCardText()">🔎 辨識卡號</button>
      <button onclick="stopScanner()">關閉相機</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="./app.js?v=20261011-7"></script>
</body>
</html>
