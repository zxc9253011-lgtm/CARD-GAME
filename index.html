<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>不老村守衛戰｜遊戲輔助系統</title>
<link rel="stylesheet" href="./style.css?v=20261011-5">
<style>
.scan-modal{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px}.scan-modal.hidden{display:none}.scan-box{width:min(560px,100%);background:#fff;border-radius:18px;padding:16px}.scan-box h2{margin:0 0 8px}.scan-video-wrap{position:relative;background:#111;border-radius:14px;overflow:hidden;aspect-ratio:3/4;max-height:68vh}.scan-video-wrap video{width:100%;height:100%;object-fit:cover;display:block}.scan-frame{position:absolute;left:12%;right:12%;top:26%;bottom:26%;border:4px solid #fff;border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.18);pointer-events:none}.scan-status{margin:10px 0;font-weight:700}.scan-actions{display:flex;gap:8px;flex-wrap:wrap}.scan-actions button{flex:1}.setup-scan{margin-top:16px;padding:14px;border:2px dashed #c9b98f;border-radius:12px;background:#fffdf8}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>🏡 不老村守衛戰</h1>
  <div class="sub">純卡牌版｜卡牌資料庫與遊戲輔助系統</div>
</header>

<section class="panel" id="setup">
  <h2>🎮 開局設定</h2>
  <div class="grid">
    <div><label>玩家人數</label><select id="players"><option>3</option><option selected>4</option><option>5</option><option>6</option></select></div>
    <div><label>本局冒險卡數量（自訂）</label><input id="adventureTotal" type="number" min="1" max="99" value="12"></div>
    <div><label>是否加入假面好人</label><select id="traitor"><option value="yes" selected>是</option><option value="no">否</option></select></div>
    <div><label>初始生命</label><input value="20" disabled></div>
  </div>

  <div class="setup-scan">
    <b>📷 開局前掃描卡牌</b>
    <p class="note">可先掃怪獸卡、知識卡、命運卡等；開始遊戲後會自動載入剛才掃到的卡。</p>
    <div class="controls">
      <button onclick="startScanner('setup')">📷 掃描卡牌</button>
    </div>
    <div id="setupScanStatus" class="note">尚未掃描</div>
  </div>

  <div class="controls"><button onclick="startGame()">開始冒險</button></div>
</section>

<section class="panel hidden" id="game">
  <h2>📊 遊戲中控</h2>
  <div class="stats">
    <div class="stat">❤️ 生命<div class="big"><span id="hpText">20</span>/20</div></div>
    <div class="stat">🃏 冒險進度<div class="big"><span id="advNowText">0</span>/<span id="advTotalText">12</span></div></div>
    <div class="stat">🔎 卡牌資料庫<div class="big">QR</div></div>
  </div>
  <div class="hpbar"><div class="hpfill" id="hpfill"></div></div>
  <div class="controls"><button onclick="changeHp(2)">+2 HP</button><button onclick="changeHp(-2)">-2 HP</button><button onclick="changeHp(4)">+4 HP</button><button onclick="changeHp(-4)">-4 HP</button></div>
  <div style="margin-top:14px"><b>冒險進度</b><div class="progressbar"><div class="progressfill" id="progressfill"></div></div></div>

  <h2 style="margin-top:22px">📷 掃描／輸入卡號</h2>
  <p class="note">QR 網址格式：<code>https://zxc9253011-lgtm.github.io/CARD-GAME/?card=M001</code></p>
  <div class="grid">
    <input id="cardCode" placeholder="輸入 K001、M001、F001、E001、B001">
    <button onclick="identifyCard()">讀取卡牌</button>
  </div>
  <div class="controls"><button onclick="startScanner('game')">📷 掃描卡牌</button></div>
  <div class="result" id="result"><h2>等待卡牌</h2><p>掃描 QR Code 或手動輸入卡號。</p></div>
</section>
</div>

<div id="scannerModal" class="scan-modal hidden">
  <div class="scan-box">
    <h2>📷 掃描 QR Code</h2>
    <div class="scan-video-wrap">
      <video id="scannerVideo" playsinline muted></video>
      <div class="scan-frame"></div>
    </div>
    <canvas id="scannerCanvas" style="display:none"></canvas>
    <div id="scannerStatus" class="scan-status">準備開啟相機…</div>
    <div class="scan-actions">
      <button onclick="stopScanner()">關閉相機</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="./app.js?v=20261011-5"></script>
</body>
</html>
